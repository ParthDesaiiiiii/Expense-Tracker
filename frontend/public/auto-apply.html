<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Auto Apply Restore</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:Inter,system-ui,Arial;background:#07102a;color:#e6eef8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:rgba(255,255,255,0.03);padding:20px;border-radius:8px;max-width:720px}
    .muted{color:#9aa4b2}
    button{padding:8px 12px;border-radius:6px;background:#4f46e5;border:none;color:white;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h2>Automatic Restore</h2>
    <div id="status" class="muted">Attempting to restore backup automatically...</div>
    <div style="margin-top:12px">If successful, you'll be redirected to the app. If nothing happens, make sure your dev server is running and open the app root (/) manually.</div>
    <div style="margin-top:12px"><button id="openRoot" style="display:none">Open App</button></div>
  </div>

  <script>
    (async function(){
      const status = document.getElementById('status')
      function setStatus(t){ status.textContent = t }
      try{
        const applied = localStorage.getItem('et_force_restore_applied_v1')
        if (applied){ setStatus('Force-restore already applied previously. Redirecting to app...'); setTimeout(()=> location.href='/', 800); return }
        setStatus('Fetching /force-restore.json...')
        const res = await fetch('/force-restore.json', {cache:'no-store'})
        if (!res.ok) { setStatus('No force-restore file found on server.'); document.getElementById('openRoot').style.display='inline-block'; return }
        const parsed = await res.json()
        if (!Array.isArray(parsed) || parsed.length === 0){ setStatus('Force file invalid or empty.'); document.getElementById('openRoot').style.display='inline-block'; return }
        setStatus('Saving a snapshot of current data...')
        try{
          const now = new Date().toISOString().replace(/[:.]/g,'-')
          const cur = localStorage.getItem('et_transactions_v1') || '[]'
          localStorage.setItem('et_transactions_v1_backup_before_auto_apply_' + now, cur)
        }catch(e){ console.warn('snapshot failed', e) }
        setStatus('Applying backup (' + parsed.length + ' transactions)')
        localStorage.setItem('et_transactions_v1', JSON.stringify(parsed))
        localStorage.setItem('et_force_restore_applied_v1', '1')
        setStatus('Restore applied. Redirecting to app...')
        setTimeout(()=> location.href='/', 800)
      }catch(e){
        setStatus('Restore failed: ' + (e && e.message ? e.message : e))
        document.getElementById('openRoot').style.display='inline-block'
      }

      document.getElementById('openRoot').addEventListener('click', ()=> location.href='/')
    })()
  </script>
</body>
</html>
